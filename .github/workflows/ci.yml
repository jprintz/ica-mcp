name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Lint-grinden (ruff, regler i pyproject.toml). Formatteraren körs inte här.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff
      - name: ruff check
        run: ruff check --output-format github ica_mcp tests

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (with test extras)
        run: pip install ".[test]"
      - name: Byte-compile
        run: python -m compileall ica_mcp
      - name: Unit tests (offline helpers only — live API needs a Swedish IP)
        run: pytest -q

  # Kör testerna mot lägsta tillåtna mcp-version så att golvet i pyproject hålls ärligt.
  test-min-mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install with the lowest supported mcp
        run: |
          pip install ".[test]"
          MIN=$(grep -oE 'mcp>=[0-9.]+' pyproject.toml | cut -d= -f2)
          pip install "mcp==$MIN"
          python -c "import mcp, importlib.metadata as m; print('mcp', m.version('mcp'))"
      - name: Unit tests
        run: pytest -q
