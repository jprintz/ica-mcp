name: Release

# Publiceras till PyPI när en GitHub Release publiceras (tagga t.ex. v0.5.0).
# Använder PyPI Trusted Publishing (OIDC) — ingen lagrad token.
on:
  release:
    types: [published]

# Minsta möjliga behörighet som standard; bara publish-jobbet får id-token.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (with test extras)
        run: pip install ".[test]"
      - name: Unit tests
        run: pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0       # behövs för att kontrollera att taggen ligger på main
      - name: Verify the release commit is on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Release commit $GITHUB_SHA is not on main. Tag a commit that has been merged to main."
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        run: |
          pip install build
          python -m build
      - name: Verify release tag matches built version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="${TAG#v}"
          ls -1 dist/
          if ! ls dist/ica_mcp-"$VERSION"-*.whl >/dev/null 2>&1 \
             || [ ! -f "dist/ica_mcp-$VERSION.tar.gz" ]; then
            echo "::error::Release tag '$TAG' (version '$VERSION') does not match the built artifacts in dist/. Fix the version or the tag before releasing."
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi          # måste matcha "Environment name" i PyPI:s pending publisher
    permissions:
      id-token: write          # krävs för Trusted Publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
