[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ica-mcp"
dynamic = ["version"]
description = "MCP server for ICA (Sweden's largest grocery chain) shopping lists"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "kanylbullen" }]
keywords = ["mcp", "ica", "shopping-list", "model-context-protocol"]
dependencies = [
    "requests>=2.31",
    "PyJWT>=2.8",       # läser namnet ur id_token
    "mcp>=2.0,<3",          # MCP-server (MCPServer)
    "platformdirs>=4.0", # per-användare state-katalog (token-cache)
]

[project.optional-dependencies]
test = ["pytest>=8"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/jprintz/ica-mcp"
Repository = "https://github.com/jprintz/ica-mcp"
Upstream = "https://github.com/kanylbullen/ica-mcp"

[project.scripts]
ica-mcp = "ica_mcp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["ica_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.hatch.version]
path = "ica_mcp/__init__.py"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
# Lint only; the formatter is not enforced (the code predates ruff and is
# hand-wrapped). E501 is off for the same reason — keep new lines <= 110.
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["ica_mcp"]
